<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>
  <style>
    body {
      background: black;
      color: white;
      text-align: center;
      font-family: Arial;
      margin-top: 100px;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      background: red;
      color: white;
      border: none;
      border-radius: 10px;
    }
    #message {
      display: none;
      margin-top: 30px;
      font-size: 20px;
    }
  </style>
</head>

<body>
<audio controls autoplay loop>
  <source src="https://www2.cs.uic.edu/~i101/SoundFiles/Perfect.mp3" type="audio/mpeg">
</audio>

<h1>Hey Love ❤️</h1>

<button onclick="showMessage()">Click for Surprise</button>

<div id="message">
  <p>You are the best thing in my life 💖</p>
  <p>I’m so lucky to have you 🥺</p>
  <p>Happy Birthday / I Love You ❤️</p>
</div>

<script>
function showMessage() {
  document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
