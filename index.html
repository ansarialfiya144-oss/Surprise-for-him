<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Ashu</title>
<style>
  body {
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:'Comic Sans MS', cursive, sans-serif;
    background: radial-gradient(#000011, #000033);
    color:white;
    text-align:center;
    height:100vh;
    position:relative;
  }

  .star {
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
    z-index:0;
  }

  @keyframes twinkle {
    from {opacity:0.2;}
    to {opacity:1;}
  }

  #mainText {
    position:relative;
    top:30%;
    font-size:3em;
    font-weight:bold;
    z-index:2;
  }

  #surpriseBtn {
    position:relative;
    top:35%;
    padding:15px 30px;
    font-size:1.5em;
    cursor:pointer;
    border:none;
    border-radius:10px;
    background:#ff3366;
    color:white;
    transition:0.3s;
    z-index:2;
  }

  #surpriseBtn:hover {
    background:#ff6699;
  }

  #finalMsg {
    display:none;
    font-size:1.8em;
    margin-top:20px;
    line-height:1.5em;
    max-width:85%;
    margin-left:auto;
    margin-right:auto;
    z-index:2;
    position:relative;
  }

  .heart {
    position:absolute;
    font-size:2em;
    color:#ff3f8e;
    animation:fall 5s linear forwards;
  }

  @keyframes fall {
    0% {top:-50px; opacity:1;}
    100% {top:100vh; opacity:0;}
  }

</style>
</head>
<body>

<div id="mainText">Happy Birthday Ashu 🎉</div>
<button id="surpriseBtn">🎁 Click for Surprise 🎁</button>
<div id="finalMsg">
  Happy Birthday, my love! 🥰<br>
  Every moment with you feels like a dream, and I can’t wait to make even more amazing memories together.<br>
  You’re my favorite person and my heart’s happiness 💖<br>
  Keep smiling and never forget how much I love you 😘🎉
</div>

<audio id="bdaySong">
  <source src="https://cdn.pixabay.com/download/audio/2023/03/15/audio_3da8e71594.mp3?filename=romantic-piano-11960.mp3" type="audio/mpeg">
</audio>

<script>
  // Stars
  for(let i=0;i<150;i++){
    let star = document.createElement('div');
    star.className='star';
    star.style.top=Math.random()*100+'%';
    star.style.left=Math.random()*100+'%';
    star.style.width=(Math.random()*3+1)+'px';
    star.style.height=star.style.width;
    star.style.animationDuration=(Math.random()*3+2)+'s';
    document.body.appendChild(star);
  }

  const btn = document.getElementById('surpriseBtn');
  const mainText = document.getElementById('mainText');
  const finalMsg = document.getElementById('finalMsg');
  const bdaySong = document.getElementById('bdaySong');

  function createHeart(){
    const heart = document.createElement('div');
    heart.className='heart';
    heart.style.left=Math.random()*100+'vw';
    heart.style.fontSize=(Math.random()*30+20)+'px';
    heart.innerText='💖';
    document.body.appendChild(heart);
    setTimeout(()=>{heart.remove()},5000); // remove after falling
  }

  btn.addEventListener('click',()=>{
    mainText.style.display='none';
    btn.style.display='none';
    finalMsg.style.display='block';

    bdaySong.play();

    // create hearts every 300ms for 5 sec
    const heartInterval = setInterval(createHeart,300);
    setTimeout(()=>clearInterval(heartInterval),5000);
  });

</script>
</body>
</html>
