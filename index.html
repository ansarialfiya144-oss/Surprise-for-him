<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Ashu</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: radial-gradient(#000011, #000033);
      color: white;
      text-align: center;
      height: 100vh;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      from {opacity: 0.2;}
      to {opacity: 1;}
    }

    #mainText {
      position: absolute;
      top: 35%;
      width: 100%;
      font-size: 3em;
      font-weight: bold;
      animation: fadeIn 2s forwards;
    }

    @keyframes fadeIn {
      0% {opacity: 0; transform: scale(0.8);}
      100% {opacity: 1; transform: scale(1);}
    }

    #surpriseBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 1.5em;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: #ff3366;
      color: white;
      transition: 0.3s;
    }

    #surpriseBtn:hover {
      background: #ff6699;
    }

    /* Hearts animation */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: floatUp 3s ease-in forwards;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .heart::before { top: -10px; left: 0; }
    .heart::after { left: 10px; top: 0; }

    @keyframes fall {
      0% {opacity: 1; transform: translateY(-50px);}
      100% {opacity: 0; transform: translateY(700px);}
    }

    #finalMsg {
      display: none;
      font-size: 1.8em;
      margin-top: 20px;
      line-height: 1.5em;
      max-width: 85%;
      margin-left: auto;
      margin-right: auto;
      animation: fadeIn 2s forwards;
    }
  </style>
</head>
<body>

  <div id="mainText">Happy Birthday Ashu 🎉</div>

  <button id="surpriseBtn">🎁 Click for Surprise 🎁</button>

  <div id="finalMsg">
    Happy Birthday, my love! 🥰<br>
    Every moment with you feels like a dream, and I can’t wait to make even more amazing memories together.<br>
    You’re my favorite person and my heart’s happiness 💖<br>
    Keep smiling and never forget how much I love you 😘🎉
  </div>

  <!-- Soft romantic instrumental music -->
  <audio id="bdaySong" autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2023/03/15/audio_3da8e71594.mp3?filename=romantic-piano-11960.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Stars
    for (let i = 0; i < 150; i++) {
      let star = document.createElement('div');
      star.className = 'star';
      star.style.top = Math.random() * 100 + '%';
      star.style.left = Math.random() * 100 + '%';
      star.style.width = (Math.random() * 3 + 1) + 'px';
      star.style.height = star.style.width;
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      document.body.appendChild(star);
    }

    const btn = document.getElementById('surpriseBtn');
    const mainText = document.getElementById('mainText');
    const finalMsg = document.getElementById('finalMsg');

    btn.addEventListener('click', () => {
      mainText.style.display = 'none'; // hide initial text
      finalMsg.style.display = 'block';

      // Create falling hearts
      for (let i = 0; i < 50; i++) {
        let heart = document.createElement('div');
        heart.className = 'heart';
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
        document.body.appendChild(heart);

        setTimeout(() => { heart.remove(); }, 5000);
      }

      btn.style.display = 'none'; // hide button
    });
  </script>

</body>
</html>
