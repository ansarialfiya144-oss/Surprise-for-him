<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Ashu</title>
  <style>
    /* Full screen background with stars */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: radial-gradient(#000011, #000033);
      color: #fff;
      text-align: center;
      height: 100vh;
    }

    /* Star background animation */
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      from {opacity: 0.2;}
      to {opacity: 1;}
    }

    /* Main birthday text */
    #mainText {
      position: absolute;
      top: 30%;
      width: 100%;
      font-size: 3em;
      font-weight: bold;
      animation: fadeIn 3s forwards;
    }

    @keyframes fadeIn {
      0% {opacity: 0; transform: scale(0.8);}
      100% {opacity: 1; transform: scale(1);}
    }

    /* Surprise button */
    #surpriseBtn {
      margin-top: 40%;
      padding: 15px 30px;
      font-size: 1.5em;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: #ff3366;
      color: white;
      transition: 0.3s;
    }

    #surpriseBtn:hover {
      background: #ff6699;
    }

    /* Hearts animation */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: floatUp 3s ease-in forwards;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .heart::before { top: -10px; left: 0; }
    .heart::after { left: 10px; top: 0; }

    @keyframes floatUp {
      0% {opacity: 1; transform: translateY(0) rotate(45deg);}
      100% {opacity: 0; transform: translateY(-300px) rotate(45deg);}
    }

    /* Final message */
    #finalMsg {
      display: none;
      font-size: 1.8em;
      margin-top: 20px;
      line-height: 1.5em;
      animation: fadeIn 2s forwards;
      max-width: 80%;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <div id="mainText">Happy Birthday Ashu 🎉</div>

  <button id="surpriseBtn">🎁 Click for Surprise 🎁</button>

  <div id="finalMsg">
    Happy Birthday, my love! 🥰<br>
    Every moment with you feels like a dream, and I can’t wait to make even more amazing memories together.<br>
    You’re my favorite person, my cuddle buddy, and my heart’s happiness 💖<br>
    Keep smiling and never forget how much I love you 😘🎉
  </div>

  <audio id="bdaySong" autoplay>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Generate stars
    for(let i=0; i<150; i++){
      let star = document.createElement('div');
      star.className = 'star';
      star.style.top = Math.random()*100 + '%';
      star.style.left = Math.random()*100 + '%';
      star.style.width = (Math.random()*3+1) + 'px';
      star.style.height = star.style.width;
      star.style.animationDuration = (Math.random()*3+2) + 's';
      document.body.appendChild(star);
    }

    // Surprise button click
    const btn = document.getElementById('surpriseBtn');
    const finalMsg = document.getElementById('finalMsg');

    btn.addEventListener('click', () => {
      finalMsg.style.display = 'block';
      // Generate hearts
      for(let i=0; i<50; i++){
        let heart = document.createElement('div');
        heart.className = 'heart';
        heart.style.left = Math.random()*100 + '%';
        heart.style.animationDuration = (Math.random()*2 + 2) + 's';
        document.body.appendChild(heart);
        setTimeout(() => { heart.remove(); }, 3000);
      }
      btn.style.display = 'none';
    });
  </script>

</body>
</html>
