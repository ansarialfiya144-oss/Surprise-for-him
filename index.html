<!DOCTYPE html>
<html>
<head>
  <title>For Ashu ❤️</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #000000, #2b0033);
      color: white;
      text-align: center;
      font-family: Arial;
      overflow: hidden;
    }

    h1 {
      margin-top: 100px;
      font-size: 35px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      background: red;
      color: white;
      border: none;
      border-radius: 10px;
    }

    #message {
      display: none;
      margin-top: 30px;
      font-size: 20px;
    }

    .heart {
      position: fixed;
      color: red;
      font-size: 20px;
      animation: fall 5s linear infinite;
    }

    @keyframes fall {
      0% { top: -10%; opacity: 1; }
      100% { top: 110%; opacity: 0; }
    }
  </style>
</head>

<body>

<h1>Namaste Ashu ❤️</h1>

<button onclick="startSurprise()">Click for Surprise</button>

<div id="message">
  <p>You are my everything 💖</p>
  <p>I’m so lucky to have you 🥺</p>
  <p>Forever with you ❤️</p>
</div>

<audio id="song">
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
function startSurprise() {
  document.getElementById("message").style.display = "block";
  document.getElementById("song").play();

  // hearts generate
  setInterval(() => {
    let heart = document.createElement("div");
    heart.innerHTML = "❤️";
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }, 300);
}
</script>

</body>
</html>
