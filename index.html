<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Ashu</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: radial-gradient(#000011, #000033);
      color: white;
      text-align: center;
      height: 100vh;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      from {opacity: 0.2;}
      to {opacity: 1;}
    }

    #mainText {
      position: absolute;
      top: 35%;
      width: 100%;
      font-size: 3em;
      font-weight: bold;
      animation: fadeIn 2s forwards;
    }

    @keyframes fadeIn {
      0% {opacity: 0; transform: scale(0.8);}
      100% {opacity: 1; transform: scale(1);}
    }

    #surpriseBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 1.5em;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: #ff3366;
      color: white;
      transition: 0.3s;
    }

    #surpriseBtn:hover {
      background: #ff6699;
    }

    .heart {
      position: absolute;
      width: 25px;
      height: 25px;
      background: red;
      transform: rotate(45deg);
      animation: fallDown 4s ease-in infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 25px;
      height: 25px;
      background: red;
      border-radius: 50%;
    }

    .heart::before { top: -12px; left: 0; }
    .heart::after { left: 12px; top: 0; }

    @keyframes fallDown {
      0% {opacity: 1; transform: translateY(-50px) rotate(45deg);}
      100% {opacity: 0; transform: translateY(650px) rotate(45deg);}
    }

    #finalMsg {
      display: none;
      font-size: 1.8em;
      margin-top: 20px;
      line-height: 1.5em;
      max-width: 85%;
      margin-left: auto;
      margin-right: auto;
      animation: fadeIn 2s forwards;
    }
